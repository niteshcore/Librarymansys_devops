services:
  web:
    build: .
    # Same name as on Docker Hub, so "docker compose pull" gets the pipeline's image
    image: niteshcore/library-devops:latest
    container_name: library-app
    ports:
      - "5000:5000"
    environment:
      DATABASE_PATH: /app/data/library.db
    volumes:
      # Named volume: the database survives when the container is recreated
      - library-data:/app/data
    restart: unless-stopped
    healthcheck:
      # The slim image has no curl, so Python calls /health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  library-data:
