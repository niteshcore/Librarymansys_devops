# Name shown in the GitHub "Actions" tab
name: CI/CD Pipeline

# WHEN should this pipeline run?
on:
  push:
    branches: [main]      # every push to the main branch
  pull_request:
    branches: [main]      # every pull request that targets main

# Image name on Docker Hub, e.g. "username/library-devops" (username comes from a secret)
env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/library-devops

# WHAT should it do? A pipeline is made of jobs; each job is a list of steps.
jobs:
  # ---------- Job 1: CI - run the tests ----------
  test:
    # GitHub gives us a brand-new Ubuntu Linux computer for this job
    runs-on: ubuntu-latest

    steps:
      # 1. Download our repository's code onto that computer
      - name: Checkout code
        uses: actions/checkout@v7

      # 2. Install Python 3.11 (the same version our Docker image uses)
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip      # remember downloaded packages so later runs are faster

      # 3. Install Flask, gunicorn and pytest from requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 4. Run all 18 tests. If any test fails, this step fails and the pipeline turns red.
      - name: Run tests
        run: pytest -v

  # ---------- Job 2: CD - build the Docker image and push it to Docker Hub ----------
  build-and-push:
    # Start only after the "test" job has passed
    needs: test
    # Only for a real push to main (not for pull requests)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Log in with the secrets saved in GitHub (Settings -> Secrets and variables -> Actions)
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # QEMU lets this Intel/AMD machine also build an image for ARM (Apple Silicon Macs)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # Buildx is Docker's builder that can make images for several chip types at once
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build from our Dockerfile and push with two tags: "latest" and the commit SHA
      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # Reuse unchanged layers from earlier runs (Docker layer caching inside CI)
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- Job 3: CD - deploy the new image and check it is healthy ----------
  deploy:
    # Start only after the new image is on Docker Hub
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      # We need docker-compose.yml from the repository
      - name: Checkout code
        uses: actions/checkout@v7

      # Download the image we just pushed from Docker Hub
      - name: Pull the new image
        run: docker compose pull

      # Start it in the background; --wait blocks until Docker's healthcheck says "healthy"
      - name: Start the app with Docker Compose
        run: docker compose up -d --no-build --wait --wait-timeout 60

      # Smoke test: /health must answer HTTP 200, otherwise the job (and pipeline) fails
      - name: Smoke test /health
        run: |
          docker compose ps
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health)
          echo "GET /health returned HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            docker compose logs
            exit 1
          fi
